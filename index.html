<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Speech Recognition Test</title>
</head>
<body>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>

  <p id="status">
    <span id="dot" style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#999; margin-right:6px; vertical-align:middle;"></span>
    <span id="statusText">Idle</span>
  </p>

  <h3>Transcript:</h3>
  <p id="output" style="min-height: 1.5em; padding: 8px; border: 1px solid #ccc;"></p>

  <script src="/main.js"></script>
</body>
</html>
